server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # File uploads (photos, contracts) go up to 25 MB through the API.
  client_max_body_size 30m;

  # Backend API — same-origin, proxied to the api service on the compose network.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache hashed assets, no-cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: all routes fall back to index.html (client-side routing + acceptance links).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
