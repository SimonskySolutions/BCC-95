server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets, no-cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: all routes fall back to index.html (client-side routing + acceptance links).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
